# 纸上功夫(考研传统阅读助手)——Docker Compose 编排
# 用法:cp .env.example .env(填 APP_ID / APP_SECRET / ADMIN_PASSWORD)
#       docker compose up -d --build
# 说明:compose 会自动读取同目录 .env 作为变量来源;DATABASE_URL 在下方已指向
#       compose 内的 mysql 服务(生产请修改为独立数据库并妥善保管口令)。
services:
  mysql:
    image: mysql:8.0
    container_name: kaoyan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass_change_me
      MYSQL_DATABASE: kaoyan
      MYSQL_USER: kaoyan
      MYSQL_PASSWORD: kaoyan_pass_change_me
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+00:00'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_pass_change_me"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    container_name: kaoyan-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 与上面 mysql 服务的账号口令保持一致
      DATABASE_URL: mysql://kaoyan:kaoyan_pass_change_me@mysql:3306/kaoyan
      APP_ID: ${APP_ID:-kaoyan-default-app}
      APP_SECRET: ${APP_SECRET:-please_set_a_random_secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  mysql-data:
