# 纸上功夫(考研传统阅读助手)——CI 工作流
# 每次推送/PR 时执行安装、类型检查、Lint、单元测试、构建和产物冒烟。
# 真实 LLM 渠道验收仍保留在仓库外部环境，不在公共 CI 中调用真实密钥。

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Node 22 · 类型检查 · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查(tsc)
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: 单元测试(Vitest)
        run: npm test

      - name: 构建(前端 + 后端)
        run: npm run build

      - name: 产物冒烟
        run: |
          test -f dist/boot.js && echo "dist/boot.js OK"
          test -f db/final_corpus.json && echo "真题语料 OK"
          test -f db/migrations/meta/_journal.json && echo "迁移 meta OK"

      - name: 依赖安全报告（不阻断）
        continue-on-error: true
        run: npm audit --audit-level=high
