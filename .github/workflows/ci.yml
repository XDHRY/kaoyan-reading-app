# 纸上功夫(考研传统阅读助手)——GitHub 云端体检
# 仓库可自给的检查必须在官方 runner 上真实执行；依赖本机 MySQL dump/真实 LLM 密钥的
# 离线全量验收不伪装成 CI 已覆盖，相关缺口会显式提示。

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  quality:
    name: Node 22 · 静态门禁 · Web运行冒烟
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查(tsc)
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Vitest 测试清单
        shell: bash
        run: |
          count=$(find api -type f \( -name '*.test.ts' -o -name '*.spec.ts' \) | wc -l | tr -d ' ')
          echo "Vitest test files: $count"
          if [ "$count" -eq 0 ]; then
            echo "::warning::vitest.config.ts 只匹配 api/**/*.test.ts / api/**/*.spec.ts，但仓库当前没有匹配文件；npm test 会以 No test files found 退出 1。"
          else
            npm test
          fi

      - name: 构建前端 + 后端
        run: npm run build

      - name: 核心产物与真题语料冒烟
        run: |
          test -f dist/boot.js
          test -f dist/public/index.html
          test -f db/final_corpus.json
          test -f db/migrations/meta/_journal.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const corpus = JSON.parse(fs.readFileSync('db/final_corpus.json', 'utf8'));
          if (!Array.isArray(corpus) || corpus.length !== 68) {
            throw new Error(`final_corpus.json 应为 68 篇，实际 ${Array.isArray(corpus) ? corpus.length : typeof corpus}`);
          }
          const q = corpus.reduce((n, p) => n + (Array.isArray(p.questions) ? p.questions.length : 0), 0);
          if (q !== 340) throw new Error(`真题应为 340 题，实际 ${q}`);
          console.log(`corpus OK: ${corpus.length} passages / ${q} questions`);
          NODE

      - name: 真实 Chromium 应用级冒烟
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::GitHub runner 未找到 Chrome/Chromium"
            exit 1
          fi
          echo "Chrome: $CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" node scripts/test-app-level.mjs

      - name: 外部 fixture 测试覆盖说明
        run: |
          echo "::notice::scripts/test-offline-db.mjs / test-offline-caller.mjs 依赖 public/offline.db；该 DB 由未入库的 MySQL dump 构建，因此公共 GitHub runner 不能自给运行。"

      - name: 依赖安全报告（不阻断）
        continue-on-error: true
        run: npm audit --audit-level=high

  android:
    name: Android · Capacitor Sync · assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
          cache: npm

      - name: 安装 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装依赖并构建 Web
        run: |
          npm ci
          npm run build

      - name: 同步 Capacitor Android
        run: npx cap sync android

      - name: 构建 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 校验 APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kaoyan-reading-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
