<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="考研英语一阅读训练：六步 SOP 引导、AI 教练逐题精讲、错题诊断与艾宾浩斯复习，纸上功夫，日拱一卒。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 非阻塞加载：media="print" 不参与渲染阻塞，离线/慢网时首屏不再被字体 CSS 请求挂起；
         onload 成功后切回 all 才真正应用字体；加载失败（离线）则静默回落系统字体。
         任何情况下都不阻塞渲染。 -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Zhi+Mang+Xing&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Zhi+Mang+Xing&display=swap"
      />
    </noscript>
    <title>考研传统阅读助手 · 纸上功夫</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
